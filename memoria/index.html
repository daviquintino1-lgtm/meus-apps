<!doctype html><html lang="pt-BR"><head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" type="image/png" href="icon.png"><meta name="apple-mobile-web-app-title" content="Memória"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style></head><body><title>Memória da Família</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one-screen game — header with score chips, then a square-card grid that fills the width */
:root{
  --bg:#e6f1ea;
  --ink:#1d3a34;
  --muted:#5b7670;
  --sun:#f6c234;
  --sun-deep:#d9481f;
  --face:#ffffff;
  --ring:#1d3a34;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13221f;--ink:#e8f3ee;--muted:#9bb5ae;--sun:#f3c03a;--sun-deep:#e2603a;--face:#20332f;--ring:#f3c03a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13221f;--ink:#e8f3ee;--muted:#9bb5ae;--sun:#f3c03a;--sun-deep:#e2603a;--face:#20332f;--ring:#f3c03a;color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1;margin:0;text-wrap:balance;
  color:var(--sun);-webkit-text-stroke:1.5px var(--sun-deep);paint-order:stroke fill;letter-spacing:.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--face);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem}
.chip small{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.7rem;margin-right:4px}
button.again{margin-left:auto;font:inherit;font-weight:700;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:600px){.grid{grid-template-columns:repeat(5,1fr);gap:10px}}
.card{aspect-ratio:1;max-width:100%;perspective:700px;border:0;padding:0;background:none;cursor:pointer;border-radius:16px}
.inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.card.up .inner,.card.done .inner{transform:rotateY(180deg)}
.side{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:var(--sun);
  background-image:radial-gradient(circle at 25% 25%,rgba(217,72,31,.28) 0 6px,transparent 7px),radial-gradient(circle at 75% 75%,rgba(217,72,31,.28) 0 6px,transparent 7px);
  background-size:34px 34px;display:grid;place-items:center;box-shadow:inset 0 0 0 3px rgba(0,0,0,.08)}
.back span{font-family:var(--display);font-weight:800;font-size:2.2rem;color:var(--sun-deep)}
.front{transform:rotateY(180deg);background:var(--face)}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.card.done .front{box-shadow:0 0 0 3px var(--ring)}
.card.done .inner{animation:pop .4s ease .2s}
@keyframes pop{50%{transform:rotateY(180deg) scale(1.07)}}

.win{background:var(--face);border-radius:20px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.win h2{font-family:var(--display);font-size:1.8rem;margin:0;line-height:1.1}
.win p{margin:0;color:var(--muted)}
.faces{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.faces img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid var(--sun)}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.card.done .inner{animation:none}}
</style>

<div class="wrap">
  <header>
    <h1>Memória da Família</h1>
    <p class="sub">Vire duas cartas por vez e encontre os pares.</p>
  </header>
  <div class="bar">
    <span class="chip"><small>Jogadas</small><b id="moves">0</b></span>
    <span class="chip"><small>Pares</small><b id="pairs">0</b>/<span id="total">6</span></span>
    <span class="chip"><small>Tempo</small><b id="time">0:00</b></span>
    <button class="again" id="again" type="button">Recomeçar</button>
  </div>
  <section class="win" id="win" hidden>
    <h2>Achou todo mundo!</h2>
    <p id="winText"></p>
    <div class="faces" id="faces"></div>
    <button class="again" id="again2" type="button" style="margin:0">Jogar de novo</button>
  </section>
  <div class="grid" id="grid" aria-label="Cartas do jogo"></div>
</div>

<script>
const PICS = ["fotos/mae.jpg", "fotos/pai.jpg", "fotos/filha.jpg", "fotos/menino.jpg", "fotos/bebe.jpg", "fotos/pai_bebe.jpg", "fotos/skate.jpg", "fotos/menina.jpg", "fotos/oculos.jpg", "fotos/heroi.jpg"];
const grid=document.getElementById('grid');
let first=null,lock=false,moves=0,pairs=0,start=null,tick=null;
function el(id){return document.getElementById(id)}
el('total').textContent=PICS.length;
el('faces').innerHTML=PICS.map(p=>`<img src="${p}" alt="">`).join('');

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function deal(){
  first=null;lock=false;moves=0;pairs=0;start=null;clearInterval(tick);
  el('moves').textContent=0;el('pairs').textContent=0;el('time').textContent='0:00';el('win').hidden=true;
  const deck=shuffle(PICS.flatMap((p,i)=>[i,i]));
  grid.innerHTML='';
  deck.forEach((id,n)=>{
    const b=document.createElement('button');
    b.className='card';b.type='button';b.id='c'+n;b.dataset.id=id;b.setAttribute('aria-label','Carta virada');
    b.innerHTML=`<div class="inner"><div class="side back"><span>?</span></div><div class="side front"><img src="${PICS[id]}" alt=""></div></div>`;
    b.addEventListener('click',()=>flip(b));
    grid.appendChild(b);
  });
}
function flip(b){
  if(lock||b===first||b.classList.contains('done'))return;
  if(!start){start=Date.now();tick=setInterval(()=>el('time').textContent=fmt(Math.floor((Date.now()-start)/1000)),500)}
  b.classList.add('up');b.setAttribute('aria-label','Foto da família');
  if(!first){first=b;return}
  moves++;el('moves').textContent=moves;
  if(first.dataset.id===b.dataset.id){
    first.classList.add('done');b.classList.add('done');first=null;pairs++;el('pairs').textContent=pairs;
    if(pairs===PICS.length)finish();
  }else{
    lock=true;const a=first;first=null;
    setTimeout(()=>{a.classList.remove('up');b.classList.remove('up');a.setAttribute('aria-label','Carta virada');b.setAttribute('aria-label','Carta virada');lock=false},900);
  }
}
function finish(){
  clearInterval(tick);
  const secs=Math.floor((Date.now()-start)/1000);
  el('winText').textContent=`${moves} jogadas em ${fmt(secs)}.`;
  setTimeout(()=>{el('win').hidden=false;el('win').scrollIntoView({behavior:'smooth',block:'nearest'})},600);
}
el('again').onclick=deal;el('again2').onclick=deal;
deal();
</script>
<script id="auto-update">
(function(){
  var V="20261023114642";
  function check(){
    fetch("version.txt?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():""}).then(function(t){
      t=(t||"").trim();
      if(t&&t!==V){location.replace(location.pathname+"?v="+t)}
    }).catch(function(){});
  }
  document.addEventListener("visibilitychange",function(){if(!document.hidden)check()});
  window.addEventListener("pageshow",check);
  check();
  var s=document.createElement("p");
  s.textContent="Atualizado em 23/10 às 11:46";
  s.style.cssText="text-align:center;font-size:12px;opacity:.55;margin:24px 0 8px;font-family:system-ui,sans-serif";
  document.body.appendChild(s);
})();
</script></body></html>
