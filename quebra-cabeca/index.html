<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style></head><body><title>Quebra-Cabeça da Família</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one column — title, level picker, score chips, then the puzzle board at full width */
:root{
  --bg:#e6f1ea;--ink:#1d3a34;--muted:#5b7670;--sun:#f6c234;--sun-deep:#d9481f;--face:#ffffff;--ring:#1d3a34;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13221f;--ink:#e8f3ee;--muted:#9bb5ae;--sun:#f3c03a;--sun-deep:#e2603a;--face:#20332f;--ring:#f3c03a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13221f;--ink:#e8f3ee;--muted:#9bb5ae;--sun:#f3c03a;--sun-deep:#e2603a;--face:#20332f;--ring:#f3c03a;color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,7.5vw,2.6rem);line-height:1;margin:0;text-wrap:balance;
  color:var(--sun);-webkit-text-stroke:1.5px var(--sun-deep);paint-order:stroke fill}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.levels{display:flex;background:var(--face);border-radius:999px;padding:4px;gap:2px}
.levels button{font:inherit;font-weight:700;font-size:.9rem;border:0;background:none;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--sun);color:#1d3a34}
.chip{background:var(--face);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem}
.chip small{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.7rem;margin-right:4px}
.btn{font:inherit;font-weight:700;font-size:.9rem;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:var(--face);color:var(--ink)}
.push{margin-left:auto}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.board{position:relative;width:100%;max-width:100%;aspect-ratio:1100/698;border-radius:14px;overflow:hidden;
  background:var(--face);display:grid;gap:2px;padding:2px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tile{border:0;padding:0;cursor:grab;background-repeat:no-repeat;border-radius:4px;touch-action:none;
  transition:transform .15s ease,box-shadow .15s ease,opacity .15s}
.tile.sel{box-shadow:0 0 0 4px var(--sun-deep) inset;transform:scale(.9)}
.tile.src{opacity:.25}
.tile.over{box-shadow:0 0 0 4px var(--sun) inset}

.drag-ghost{position:fixed;z-index:50;pointer-events:none;border-radius:6px;background-repeat:no-repeat;
  box-shadow:0 10px 24px rgba(0,0,0,.35);transform:translate(-50%,-50%) scale(1.1)}
.tile.ok{border-radius:0}
.board.solved{gap:0;padding:0}
.board.solved .tile{border-radius:0;cursor:default}
.peek{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;pointer-events:none;transition:opacity .2s}
.board.peeking .peek{opacity:1}

.win{background:var(--face);border-radius:20px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.win h2{font-family:var(--display);font-size:1.8rem;margin:0;line-height:1.1}
.win p{margin:0;color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem;margin:0}
@media (prefers-reduced-motion:reduce){.tile,.peek{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Quebra-Cabeça da Família</h1>
    <p class="sub">Arraste uma peça com o dedo e solte em cima de outra para trocar as duas de lugar. Também dá para tocar numa peça e depois na outra.</p>
  </header>

  <div class="row">
    <div class="levels" role="group" aria-label="Dificuldade">
      <button type="button" id="lv3" data-n="3">Fácil</button>
      <button type="button" id="lv4" data-n="4">Médio</button>
      <button type="button" id="lv5" data-n="5">Difícil</button>
    </div>
  </div>

  <div class="row">
    <span class="chip"><small>Trocas</small><b id="moves">0</b></span>
    <span class="chip"><small>Certas</small><b id="right">0</b>/<span id="total">9</span></span>
    <span class="chip"><small>Tempo</small><b id="time">0:00</b></span>
  </div>

  <div class="board" id="board" aria-label="Quebra-cabeça"><div class="peek" id="peek"></div></div>

  <div class="row">
    <button class="btn ghost" id="peekBtn" type="button">Segure para ver a foto</button>
    <button class="btn push" id="again" type="button">Embaralhar</button>
  </div>
  <p class="hint">Peças no lugar certo ficam sem borda arredondada.</p>

  <section class="win" id="win" hidden>
    <h2>Foto montada!</h2>
    <p id="winText"></p>
    <button class="btn" id="next" type="button">Jogar de novo</button>
  </section>
</div>

const board=document.getElementById('board'), peek=document.getElementById('peek');
const el=id=>document.getElementById(id);
peek.style.backgroundImage=`url(${IMG})`;
let N=3, order=[], sel=null, moves=0, start=null, tick=null, done=false;
let saved=3; try{saved=+localStorage.getItem('qc-n')||3}catch(e){}
N=[3,4,5].includes(saved)?saved:3;

const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function setLevel(n){
  N=n; try{localStorage.setItem('qc-n',n)}catch(e){}
  document.querySelectorAll('.levels button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===n));
  newGame();
}
function newGame(){
  const total=N*N; el('total').textContent=total;
  do{order=shuffle([...Array(total).keys()])}while(order.filter((v,i)=>v===i).length>Math.floor(total/4));
  sel=null;moves=0;start=null;done=false;clearInterval(tick);
  el('moves').textContent=0;el('time').textContent='0:00';el('win').hidden=true;
  board.classList.remove('solved');
  board.style.gridTemplateColumns=`repeat(${N},1fr)`;board.style.gridTemplateRows=`repeat(${N},1fr)`;
  board.querySelectorAll('.tile').forEach(t=>t.remove());
  order.forEach((p,i)=>{
    const t=document.createElement('button');t.type='button';t.className='tile';t.id='t'+i;
    t.style.backgroundImage=`url(${IMG})`;t.style.backgroundSize=`${N*100}% ${N*100}%`;
    t.dataset.i=i;t.addEventListener('pointerdown',down);
    t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(i)}});
    board.insertBefore(t,peek);
  });
  paint();
}
function paint(){
  let ok=0;
  order.forEach((p,i)=>{
    const t=el('t'+i), x=p%N, y=Math.floor(p/N);
    t.style.backgroundPosition=`${x/(N-1)*100}% ${y/(N-1)*100}%`;
    t.classList.toggle('ok',p===i); if(p===i)ok++;
    t.setAttribute('aria-label',`Peça ${i+1}${p===i?', no lugar certo':''}`);
  });
  el('right').textContent=ok;
  if(ok===order.length&&moves>0)finish();
}
function startClock(){
  if(!start){start=Date.now();tick=setInterval(()=>el('time').textContent=fmt(Math.floor((Date.now()-start)/1000)),500)}
}
function swap(a,b){
  if(a===b)return;
  [order[a],order[b]]=[order[b],order[a]];moves++;el('moves').textContent=moves;
}
function tap(i){
  if(done)return;
  startClock();
  if(sel===null){sel=i;el('t'+i).classList.add('sel');return}
  el('t'+sel).classList.remove('sel');
  swap(sel,i);sel=null;paint();
}

/* Arrastar com o dedo ou o mouse; um toque sem arrastar vira "selecionar e trocar" */
let drag=null;
function tileAt(x,y){const t=document.elementFromPoint(x,y);return t&&t.classList&&t.classList.contains('tile')?t:null}
function down(e){
  if(done)return;
  e.preventDefault();
  const t=e.currentTarget;
  drag={i:+t.dataset.i,x:e.clientX,y:e.clientY,moved:false,ghost:null,over:null,id:e.pointerId};
  window.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',cancel);
}
function move(e){
  if(!drag||e.pointerId!==drag.id)return;
  e.preventDefault();
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
  if(!drag.moved){
    drag.moved=true;startClock();
    if(sel!==null){el('t'+sel).classList.remove('sel');sel=null}
    const src=el('t'+drag.i),r=src.getBoundingClientRect(),g=document.createElement('div');
    g.className='drag-ghost';g.style.width=r.width+'px';g.style.height=r.height+'px';
    g.style.backgroundImage=src.style.backgroundImage;g.style.backgroundSize=src.style.backgroundSize;g.style.backgroundPosition=src.style.backgroundPosition;
    document.body.appendChild(g);drag.ghost=g;src.classList.add('src');
  }
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  const o=tileAt(e.clientX,e.clientY);
  if(drag.over&&drag.over!==o)drag.over.classList.remove('over');
  if(o&&+o.dataset.i!==drag.i)o.classList.add('over');
  drag.over=o;
}
function end(){
  window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);
  if(drag){if(drag.ghost)drag.ghost.remove();el('t'+drag.i)?.classList.remove('src');if(drag.over)drag.over.classList.remove('over')}
}
function up(e){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;end();drag=null;
  if(!d.moved){tap(d.i);return}
  const o=tileAt(e.clientX,e.clientY);
  if(o)swap(d.i,+o.dataset.i);
  paint();
}
function cancel(){end();drag=null}
function finish(){
  done=true;clearInterval(tick);board.classList.add('solved');
  const secs=Math.floor((Date.now()-start)/1000);
  el('winText').textContent=`${moves} trocas em ${fmt(secs)}.${N<5?' Tenta o próximo nível?':''}`;
  setTimeout(()=>{el('win').hidden=false;el('win').scrollIntoView({behavior:'smooth',block:'nearest'})},500);
}
const show=v=>e=>{e.preventDefault();board.classList.toggle('peeking',v)};
const pb=el('peekBtn');
pb.addEventListener('pointerdown',show(true));['pointerup','pointerleave','pointercancel'].forEach(ev=>pb.addEventListener(ev,show(false)));
pb.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('.levels button').forEach(b=>b.addEventListener('click',()=>setLevel(+b.dataset.n)));
el('again').onclick=newGame;
el('next').onclick=()=>setLevel(Math.min(N+1,5));
setLevel(N);
</script>
</body></html>
